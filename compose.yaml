name: survive

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: survive
      POSTGRES_PASSWORD: survive
      POSTGRES_DB: survive_development
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U survive -d survive_development" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db:
